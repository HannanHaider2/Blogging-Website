name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  linting:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g htmlhint stylelint

      - name: Lint HTML files
        run: |
          htmlhint "**/*.html" --config .htmlhintrc

      - name: Lint CSS files
        run: |
          stylelint "**/*.css" --config .stylelintrc.json

  build:
    name: Build Static Website
    runs-on: ubuntu-latest
    needs: linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g parcel-bundler

      - name: Build project
        run: |
          parcel build
